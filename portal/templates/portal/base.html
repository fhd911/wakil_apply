<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}بوابة التقديم{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       PORTAL BASE — FINAL UNIFIED OFFICIAL SYSTEM
       - موحّد مع جميع الصفحات الأخيرة
       - أخف بصريًا وأكثر رسمية
       - يحافظ على التوافق مع الصفحات القديمة
    ========================================================= */

    :root{
      --bg:#f6f7f5;
      --bg-2:#f0f2ef;
      --bg-3:#e8eeea;

      --paper:#ffffff;
      --paper-2:#f9fbf8;
      --paper-3:#f3f6f3;

      --ink:#203128;
      --ink-2:#33453b;
      --muted:#6f7f76;

      --green-1:#1f3a2d;
      --green-2:#294638;
      --green-3:#4b6457;
      --green-4:#7b8f84;

      --gold-1:#846735;
      --gold-2:#ab8950;
      --gold-3:#d7c190;

      --line:#d7dfd8;
      --line-2:#c8d2ca;
      --line-3:#ebf0eb;

      --ok:#215f39;
      --warn:#8e6113;
      --danger:#8f2f2f;
      --info:#355c80;

      --ok-bg:#eff8f3;
      --ok-bd:#cfe6d8;

      --warn-bg:#fcf7ee;
      --warn-bd:#e7d7b7;

      --danger-bg:#fcf6f6;
      --danger-bd:#e7c7c7;

      --moe-deep:#0f5f49;
      --moe-mid:#1f7a62;
      --moe-soft:#2e9b81;
      --moe-mist:#edf6f2;
      --moe-mist-2:#f7fbf9;
      --moe-line:#d6e6dd;

      --shadow:0 1px 4px rgba(17,24,20,.035);
      --shadow-soft:0 2px 8px rgba(17,24,20,.04);
      --shadow-strong:0 8px 22px rgba(17,24,20,.06);

      --r:12px;
      --r-sm:8px;
      --r-lg:16px;

      --fs:13px;
      --ff:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;

      /* aliases للتوافق */
      --min-bg:var(--bg);
      --min-bg-2:var(--bg-2);
      --min-bg-3:var(--bg-3);

      --min-surface:var(--paper);
      --min-surface-2:var(--paper-2);
      --min-surface-3:var(--paper-3);

      --min-ink:var(--ink);
      --min-ink-2:var(--ink-2);
      --min-muted:var(--muted);

      --min-green-1:var(--green-1);
      --min-green-2:var(--green-2);
      --min-green-3:var(--green-3);
      --min-green-4:var(--green-4);

      --min-gold-1:var(--gold-1);
      --min-gold-2:var(--gold-2);
      --min-gold-3:var(--gold-3);

      --min-line:var(--line);
      --min-line-2:var(--line-2);

      --min-shadow:var(--shadow);
      --min-shadow-soft:var(--shadow-soft);
      --min-shadow-strong:var(--shadow-strong);

      --min-ok:var(--ok);
      --min-ok-soft:var(--ok-bg);
      --min-ok-line:var(--ok-bd);

      --min-warn:var(--warn);
      --min-warn-soft:var(--warn-bg);
      --min-warn-line:var(--warn-bd);

      --min-danger:var(--danger);
      --min-danger-soft:var(--danger-bg);
      --min-danger-line:var(--danger-bd);

      --card:var(--paper);
      --txt:var(--ink);
      --mut:var(--muted);
      --pri:var(--green-2);
      --pri2:var(--green-3);
      --blue:var(--info);
      --line-strong:var(--line);
      --shadow2:var(--shadow-soft);
      --ff-main:var(--ff);
    }

    *{
      box-sizing:border-box;
      font-family:var(--ff);
      font-weight:400;
    }

    html, body{
      margin:0;
      padding:0;
      background:linear-gradient(180deg,#f7faf8 0%, #eff4f1 58%, #e8eeea 100%);
      color:var(--txt);
      font-size:var(--fs);
    }

    body{
      direction:rtl;
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }

    a{
      color:inherit;
      text-decoration:none;
    }

    img{
      max-width:100%;
      display:block;
    }

    button,
    input,
    select,
    textarea{
      font:inherit;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */
    .topbar{
      position:sticky;
      top:0;
      z-index:60;
      background:rgba(255,255,255,.88);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
      box-shadow:0 4px 14px rgba(16,34,27,.03);
    }

    .wrap{
      max-width:1500px;
      margin:0 auto;
      padding:12px 14px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:800;
      letter-spacing:0;
      font-size:14px;
      color:var(--green-1);
      min-width:0;
    }

    .dot{
      width:11px;
      height:11px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--moe-mid),var(--green-3));
      box-shadow:0 0 0 4px rgba(171,137,80,.10);
      flex:0 0 auto;
    }

    .ver{
      color:var(--muted);
      font-size:10px;
      white-space:nowrap;
      border:1px solid var(--line);
      background:var(--paper-2);
      border-radius:999px;
      padding:5px 10px;
      font-weight:800;
    }

    /* =========================================================
       SHELL
    ========================================================= */
    .shell{
      max-width:1500px;
      margin:0 auto;
      padding:12px 14px 28px;
    }

    /* =========================================================
       LEGACY COMPONENTS
    ========================================================= */
    .hero{
      margin:0 0 10px;
      padding:12px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:linear-gradient(180deg,#ffffff,#fbfcfa);
      box-shadow:var(--shadow-soft);
    }

    .hero .ht{
      margin:0;
      font-size:15px;
      font-weight:800;
      color:var(--green-1);
    }

    .hero .hs{
      margin:4px 0 0;
      color:var(--muted);
      font-size:11.5px;
      line-height:1.8;
      font-weight:700;
    }

    .card{
      background:linear-gradient(180deg,#ffffff,#fbfcfa);
      border:1px solid var(--line);
      border-radius:12px;
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .hd{
      padding:14px 14px 10px;
      border-bottom:1px solid var(--line-3);
      background:linear-gradient(180deg,#ffffff,#f8fbf9);
    }

    .title{
      font-size:15px;
      font-weight:800;
      margin:0;
      line-height:1.5;
      color:var(--green-1);
    }

    .sub{
      margin:5px 0 0;
      color:var(--muted);
      font-size:11px;
      line-height:1.8;
      font-weight:700;
    }

    .bd{
      padding:14px;
    }

    .field label{
      display:block;
      color:var(--green-2);
      font-size:10.4px;
      margin:0 0 6px;
      font-weight:800;
    }

    .input{
      width:100%;
      padding:8px 12px;
      border-radius:8px;
      border:1px solid var(--line-2);
      outline:none;
      font-size:9.6px;
      background:#fff;
      font-weight:400;
      color:var(--ink);
      min-height:39px;
      box-shadow:none;
    }

    .input:focus{
      border-color:var(--gold-2);
      box-shadow:0 0 0 2px rgba(171,137,80,.08);
    }

    .btn{
      appearance:none;
      border:1px solid var(--line-2);
      cursor:pointer;
      padding:6px 12px;
      border-radius:8px;
      font-weight:900;
      font-size:9.4px;
      background:#fff;
      color:var(--green-2);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      line-height:1;
      white-space:nowrap;
      transition:background .12s ease, border-color .12s ease, transform .12s ease;
      box-shadow:none;
      min-height:35px;
    }

    .btn:hover{
      transform:translateY(-1px);
      background:var(--paper-2);
      border-color:#b8c6bb;
    }

    .btn:active{
      transform:translateY(0);
    }

    .btn.secondary{
      background:#fff;
      color:var(--green-2);
      border-color:var(--line-2);
    }

    .btn.primary{
      background:var(--green-2);
      color:#fff;
      border-color:var(--green-2);
    }

    .btn.warn{
      background:var(--warn-bg);
      color:#8a6526;
      border-color:var(--warn-bd);
    }

    .btn.danger{
      background:var(--danger-bg);
      color:#8f2f2f;
      border-color:var(--danger-bd);
    }

    .btn.ok{
      background:var(--ok-bg);
      color:#1c6a44;
      border-color:var(--ok-bd);
    }

    .row{
      display:flex;
      gap:10px;
      justify-content:flex-end;
      flex-wrap:wrap;
    }

    .alert{
      border:1px solid var(--danger-bd);
      background:var(--danger-bg);
      color:#8f2f2f;
      padding:10px 12px;
      border-radius:10px;
      font-size:9px;
      margin:0 0 12px;
      line-height:1.8;
      font-weight:800;
    }

    .list{
      display:grid;
      gap:10px;
    }

    .item{
      border:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#fbfcfa);
      border-radius:10px;
      padding:12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      box-shadow:var(--shadow-soft);
    }

    .meta{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .nm{
      font-weight:800;
      line-height:1.5;
      color:var(--green-1);
    }

    .sm{
      color:var(--muted);
      font-size:9px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      font-weight:700;
    }

    .rank{
      min-width:40px;
      height:32px;
      border-radius:8px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#fcf7ee;
      color:#8a6526;
      font-weight:900;
      border:1px solid #e7d7b7;
      flex:0 0 auto;
      font-size:9px;
    }

    .radio{
      border:1px solid var(--line);
      padding:12px;
      border-radius:10px;
      background:linear-gradient(180deg,#ffffff,#fbfcfa);
      display:flex;
      gap:10px;
      align-items:flex-start;
      box-shadow:var(--shadow-soft);
    }

    .radio input{
      margin-top:5px;
    }

    /* =========================================================
       UNIFIED UI SYSTEM
    ========================================================= */
    .ui, .ui *{
      box-sizing:border-box;
      font-family:var(--ff);
      font-weight:400;
    }

    .ui{
      direction:rtl;
      color:var(--txt);
      font-size:13px;
    }

    .ui-page{
      max-width:1500px;
      margin:0 auto;
      padding:4px 0 10px;
    }

    .ui-top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
      margin-bottom:12px;
      padding:16px 18px 14px;
      border:1px solid var(--line);
      border-radius:12px;
      background:
        radial-gradient(circle at 88% 22%, rgba(46,155,129,.09) 0 2px, transparent 2.5px) 0 0/18px 18px,
        radial-gradient(circle at 82% 34%, rgba(15,95,73,.05) 0 2px, transparent 2.5px) 0 0/22px 22px,
        linear-gradient(180deg,#ffffff 0%, #fbfcfa 100%);
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
      border-inline-start:4px solid var(--moe-mid);
    }

    .ui-top::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:1px;
      background:linear-gradient(90deg,var(--green-2) 0%, var(--gold-2) 100%);
      opacity:.95;
    }

    .ui-top > *{
      position:relative;
      z-index:1;
    }

    .ui-title-wrap{
      display:flex;
      flex-direction:column;
      gap:6px;
      min-width:260px;
    }

    .ui-title{
      margin:0;
      font-size:20px;
      font-weight:900;
      letter-spacing:0;
      line-height:1.4;
      color:var(--green-1);
    }

    .ui-subtitle{
      margin:0;
      color:var(--muted);
      font-size:10.4px;
      line-height:1.85;
      font-weight:800;
    }

    .ui-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    .ui-card{
      background:linear-gradient(180deg,#ffffff,#fbfcfa);
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
      box-shadow:var(--shadow);
      position:relative;
    }

    .ui-card::before{
      content:"";
      position:absolute;
      inset:0 0 auto 0;
      height:1px;
      background:linear-gradient(90deg,var(--green-2) 0%, var(--gold-2) 100%);
      opacity:.95;
    }

    .ui-card-head{
      padding:11px 12px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#f8fbf9);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
      position:relative;
      z-index:1;
    }

    .ui-card-body{
      padding:12px;
      position:relative;
      z-index:1;
    }

    .ui-section{
      padding:12px;
      position:relative;
      z-index:1;
    }

    .ui-divider-top{
      border-top:1px solid var(--line);
    }

    .ui-btn{
      appearance:none;
      border:1px solid var(--line-2);
      background:#fff;
      color:var(--green-2);
      border-radius:8px;
      padding:6px 12px;
      font-size:9.4px;
      font-weight:900;
      line-height:1;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      white-space:nowrap;
      transition:background .12s ease, border-color .12s ease, transform .12s ease;
      box-shadow:none;
      min-height:35px;
    }

    .ui-btn:hover{
      transform:translateY(-1px);
      border-color:#b8c6bb;
      background:var(--paper-2);
    }

    .ui-btn:active{
      transform:translateY(0);
    }

    .ui-btn-primary{
      border-color:var(--green-2);
      background:var(--green-2);
      color:#fff;
    }

    .ui-btn-ok{
      border-color:var(--ok-bd);
      background:var(--ok-bg);
      color:#1c6a44;
    }

    .ui-btn-warn{
      border-color:var(--warn-bd);
      background:var(--warn-bg);
      color:#8a6526;
    }

    .ui-btn-danger{
      border-color:var(--danger-bd);
      background:var(--danger-bg);
      color:#8f2f2f;
    }

    .ui-btn-sm{
      padding:5px 10px;
      font-size:8.4px;
      min-height:30px;
      border-radius:8px;
    }

    .ui-btn-icon{
      width:18px;
      height:18px;
      border-radius:999px;
      display:inline-grid;
      place-items:center;
      background:rgba(2,6,23,.04);
      border:1px solid var(--line);
      font-size:10px;
      line-height:1;
      flex:0 0 auto;
    }

    .ui-btn-primary .ui-btn-icon{
      background:rgba(255,255,255,.16);
      border-color:rgba(255,255,255,.22);
      color:#fff;
    }

    .ui-pill{
      display:inline-flex;
      align-items:center;
      gap:7px;
      padding:4px 9px;
      min-height:28px;
      border-radius:8px;
      border:1px solid var(--line);
      background:var(--paper-2);
      font-size:9px;
      color:var(--ink-2);
      white-space:nowrap;
      font-weight:900;
    }

    .ui-pill b{
      font-weight:900;
    }

    .ui-pill-ok{
      background:var(--ok-bg);
      border-color:var(--ok-bd);
      color:#1c6a44;
    }

    .ui-pill-warn{
      background:var(--warn-bg);
      border-color:var(--warn-bd);
      color:#8a6526;
    }

    .ui-pill-danger{
      background:var(--danger-bg);
      border-color:var(--danger-bd);
      color:#8f2f2f;
    }

    .ui-dot{
      width:8px;
      height:8px;
      border-radius:999px;
      background:var(--moe-mid);
      box-shadow:none;
      flex:0 0 auto;
    }

    .ui-label{
      display:block;
      font-size:9.3px;
      color:var(--green-1);
      margin-bottom:5px;
      font-weight:900;
    }

    .ui-help{
      margin-top:4px;
      color:var(--muted);
      font-size:8.2px;
      line-height:1.7;
      font-weight:800;
    }

    .ui-error{
      margin-top:5px;
      color:#8f2f2f;
      font-size:8.4px;
      line-height:1.7;
      font-weight:800;
    }

    .ui-req{
      font-size:7.8px;
      color:#8a6526;
      border:1px solid #e7d7b7;
      background:#fcf7ee;
      padding:2px 8px;
      border-radius:999px;
      white-space:nowrap;
      font-weight:900;
    }

    .ui-input,
    .ui-select,
    .ui-textarea{
      width:100%;
      border:1px solid var(--line-2);
      border-radius:8px;
      padding:7px 10px;
      background:#fff;
      color:var(--ink);
      font-size:9.5px;
      outline:none;
      min-height:39px;
      transition:border-color .12s ease, box-shadow .12s ease;
      box-shadow:none;
    }

    .ui-textarea{
      min-height:92px;
      resize:vertical;
    }

    .ui-input:focus,
    .ui-select:focus,
    .ui-textarea:focus{
      border-color:var(--gold-2);
      box-shadow:0 0 0 2px rgba(171,137,80,.08);
    }

    select.ui-select{
      appearance:none;
      background-image:
        linear-gradient(45deg, transparent 50%, #94a3b8 50%),
        linear-gradient(135deg, #94a3b8 50%, transparent 50%);
      background-position:
        calc(14px) calc(50% - 2px),
        calc(8px) calc(50% - 2px);
      background-size:6px 6px, 6px 6px;
      background-repeat:no-repeat;
      padding-inline-start:34px;
    }

    .ui-field input[type="text"],
    .ui-field input[type="number"],
    .ui-field input[type="email"],
    .ui-field input[type="tel"],
    .ui-field input[type="password"],
    .ui-field input[type="date"],
    .ui-field input[type="search"],
    .ui-field input[type="file"],
    .ui-field select,
    .ui-field textarea{
      width:100%;
      border:1px solid var(--line-2);
      border-radius:8px;
      padding:7px 10px;
      background:#fff;
      color:var(--ink);
      font-size:9.5px;
      outline:none;
      min-height:39px;
      box-shadow:none;
    }

    .ui-field textarea{
      min-height:92px;
      resize:vertical;
    }

    .ui-field input:focus,
    .ui-field select:focus,
    .ui-field textarea:focus{
      border-color:var(--gold-2);
      box-shadow:0 0 0 2px rgba(171,137,80,.08);
    }

    .ui-field input[type="checkbox"],
    .ui-field input[type="radio"]{
      width:16px;
      height:16px;
      accent-color:var(--green-2);
    }

    .ui-field input[type="file"]::file-selector-button{
      margin-inline-end:10px;
      border:1px solid var(--line);
      background:var(--paper-2);
      color:var(--green-2);
      border-radius:8px;
      padding:6px 10px;
      font-size:8.4px;
      font-weight:900;
      cursor:pointer;
    }

    .ui-field{
      border:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#fbfcfa);
      border-radius:10px;
      padding:10px;
      box-shadow:var(--shadow-soft);
    }

    .ui-field-top{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:8px;
    }

    .ui-grid-1{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .ui-grid-2{
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }

    .ui-grid-3{
      display:grid;
      grid-template-columns:repeat(3, minmax(0,1fr));
      gap:10px;
    }

    .ui-grid-4{
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:10px;
    }

    @media (max-width: 1100px){
      .ui-grid-3,
      .ui-grid-4{
        grid-template-columns:repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 760px){
      .ui-grid-2,
      .ui-grid-3,
      .ui-grid-4{
        grid-template-columns:1fr;
      }
    }

    .ui-toolbar{
      padding:10px 12px;
      border-bottom:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#f8fbf9);
    }

    .ui-toolbar-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
      align-items:center;
    }

    .ui-toolbar-left,
    .ui-toolbar-right{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }

    @media (max-width: 980px){
      .ui-toolbar-row{
        grid-template-columns:1fr;
      }
    }

    .ui-table-wrap{
      overflow:auto;
      background:#fff;
      border-top:1px solid var(--line);
    }

    .ui-table{
      width:100%;
      border-collapse:collapse;
      min-width:980px;
      table-layout:fixed;
    }

    .ui-table th{
      position:sticky;
      top:0;
      z-index:2;
      background:linear-gradient(180deg,#f4f8f5 0%, #edf4ef 100%);
      border-bottom:1px solid var(--line-2);
      padding:12px 8px;
      text-align:right;
      font-size:8.8px;
      font-weight:900;
      white-space:nowrap;
      color:var(--green-1);
    }

    .ui-table td{
      border-bottom:1px solid #edf1ed;
      padding:11px 8px;
      font-size:9.35px;
      vertical-align:middle;
      white-space:nowrap;
      background:#fff;
      color:var(--ink);
    }

    .ui-table tbody tr:nth-child(even) td{
      background:#fcfdfc;
    }

    .ui-table tbody tr:hover td{
      background:#f8faf8;
    }

    .ui-muted{ color:var(--muted); }
    .ui-right{ text-align:right; }
    .ui-center{ text-align:center; }

    .ui-name{
      display:flex;
      flex-direction:column;
      gap:2px;
      white-space:normal;
      line-height:1.4;
    }

    .ui-name .n1{
      font-size:10.7px;
      font-weight:900;
      color:var(--green-1);
    }

    .ui-name .n2{
      font-size:8.8px;
      color:var(--muted);
      font-weight:800;
    }

    .ui-actions-row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:flex-end;
    }

    .ui-foot{
      padding:12px 14px;
      border-top:1px solid var(--line);
      background:linear-gradient(180deg,#ffffff,#f8fbf9);
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
    }

    .ui-modal{
      position:fixed;
      inset:0;
      background:rgba(15,23,42,.32);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:99999;
    }

    .ui-modal.on{
      display:flex;
    }

    .ui-modal-card{
      width:min(560px,94vw);
      background:linear-gradient(180deg,#ffffff,#fafcf9);
      border:1px solid var(--line);
      border-radius:12px;
      box-shadow:var(--shadow-strong);
      overflow:hidden;
    }

    .ui-modal-head{
      padding:12px;
      border-bottom:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      background:linear-gradient(180deg,#fff,#fbfcff);
    }

    .ui-modal-title{
      margin:0;
      font-size:12px;
      font-weight:900;
      color:var(--green-1);
    }

    .ui-modal-sub{
      margin:4px 0 0;
      color:var(--muted);
      font-size:8.8px;
      line-height:1.7;
      font-weight:800;
    }

    .ui-modal-body{
      padding:12px;
    }

    .ui-modal-foot{
      padding:12px;
      border-top:1px solid var(--line);
      display:flex;
      gap:8px;
      justify-content:flex-start;
      flex-direction:row-reverse;
    }

    .ui-toast{
      position:fixed;
      bottom:14px;
      inset-inline-start:14px;
      background:linear-gradient(180deg,#ffffff,#fafcf9);
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px 14px;
      box-shadow:var(--shadow-strong);
      display:none;
      z-index:9999;
      max-width:min(520px,92vw);
    }

    .ui-toast.on{
      display:block;
    }

    .ui-toast-title{
      font-size:10px;
      font-weight:900;
      color:var(--green-1);
    }

    .ui-toast-sub{
      margin-top:3px;
      font-size:8.6px;
      color:var(--muted);
      font-weight:800;
    }

    @media (max-width:720px){
      .wrap,
      .shell{
        padding-inline:12px;
      }

      .brand{
        font-size:13px;
      }

      .ver{
        font-size:9px;
      }

      .ui-top{
        border-radius:12px;
        padding:14px;
      }

      .ui-title{
        font-size:18px;
      }
    }
  </style>

  {% block extra_css %}{% endblock %}
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="topbar">
    <div class="wrap">
      <div class="brand">
        <span class="dot"></span>
        بوابة التقديم على شواغر وكيل
      </div>
      <div class="ver">نسخة التشغيل</div>
    </div>
  </div>

  <div class="shell">
    {% block hero %}{% endblock %}
    {% block page_messages %}{% endblock %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
